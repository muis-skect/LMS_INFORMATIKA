<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Informatika - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-slate-100">
    <div class="bg-indigo-900 text-white p-6 text-center">
      <div class="w-12 h-12 bg-indigo-700 rounded-xl flex items-center justify-center mx-auto mb-3 font-bold text-xl shadow">
        LMS
      </div>
      <h1 class="text-2xl font-bold">LMS Informatika</h1>
      <p class="text-indigo-200 text-sm mt-1">Portal Pembelajaran Digital Sekolah</p>
    </div>

    <div class="p-6 space-y-5">
      <div id="status-db" class="bg-blue-50 border border-blue-200 text-blue-700 p-3 rounded-xl text-xs flex items-center justify-between">
        <span id="status-text"><i class="fas fa-spinner fa-spin mr-1"></i> Menghubungkan ke Google Sheets...</span>
      </div>

      <div id="login-error" class="hidden bg-rose-50 border border-rose-200 text-rose-700 p-3 rounded-xl text-xs flex items-center gap-2">
        <i class="fas fa-exclamation-circle text-base"></i>
        <span id="error-text">NISN/NIP tidak terdaftar!</span>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Pilih Peran</label>
          <select id="user-role" class="w-full p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="Siswa">Siswa (Gunakan NISN)</option>
            <option value="Guru">Guru (Gunakan NIP)</option>
            <option value="Admin">Admin / TU</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Nomor Induk (NISN / NIP)</label>
          <div class="relative">
            <i class="fas fa-user absolute left-4 top-3.5 text-slate-400"></i>
            <input type="text" id="input-nisn" required placeholder="Masukkan NISN / NIP"
              class="w-full pl-11 pr-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <button type="submit" id="btn-submit" disabled class="w-full bg-slate-400 text-white font-bold py-3 rounded-xl cursor-not-allowed transition shadow-lg">
          Memuat Data...
        </button>
      </form>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFroZV42YVKy8UrVhh1nr8FR9jH9JBATUAhZ_O4QJfiG6d23ejVzHo0FWVY7zO8rEF/exec";
    let DATABASE_USER = [];

    // Menggunakan Script Tag Injection untuk menghindari Blokir CORS
    function loadDataJSONP() {
      const script = document.createElement('script');
      script.src = `${GOOGLE_SCRIPT_URL}?callback=handleDataResponse`;
      document.body.appendChild(script);
    }

    function handleDataResponse(data) {
      DATABASE_USER = data;
      const statusBox = document.getElementById('status-db');
      const statusText = document.getElementById('status-text');
      const btnSubmit = document.getElementById('btn-submit');

      statusBox.className = "bg-emerald-50 border border-emerald-200 text-emerald-700 p-3 rounded-xl text-xs flex items-center justify-between";
      statusText.innerHTML = `<i class="fas fa-check-circle mr-1"></i> Terhubung ke Database (${DATABASE_USER.length} Akun)`;
      
      btnSubmit.disabled = false;
      btnSubmit.className = "w-full bg-indigo-700 text-white font-bold py-3 rounded-xl hover:bg-indigo-800 transition shadow-lg cursor-pointer";
      btnSubmit.innerHTML = `Masuk ke Portal <i class="fas fa-arrow-right ml-2"></i>`;
    }

    window.onload = loadDataJSONP;

    function handleLogin(e) {
      e.preventDefault();
      const role = document.getElementById('user-role').value;
      const inputId = document.getElementById('input-nisn').value.trim();
      const errorBox = document.getElementById('login-error');
      const errorText = document.getElementById('error-text');

      const foundUser = DATABASE_USER.find(user => 
        String(user.role).toLowerCase() === role.toLowerCase() && 
        String(user.id).trim() === String(inputId).trim()
      );

      if (foundUser) {
        // Simpan sesi user ke LocalStorage lalu pindah ke halaman dashboard.html
        localStorage.setItem('session_user', JSON.stringify(foundUser));
        window.location.href = "dashboard.html";
      } else {
        errorText.innerText = `${role} dengan Nomor ${inputId} tidak terdaftar!`;
        errorBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
