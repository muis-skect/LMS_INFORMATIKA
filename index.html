<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Informatika - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library FontAwesome untuk Ikon -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Library Scan QR / Barcode -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-indigo-900 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-indigo-700 text-white rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold mb-3 shadow-lg">
        LMS
      </div>
      <h1 class="text-2xl font-bold text-slate-800">LMS Informatika</h1>
      <p class="text-slate-500 text-sm mt-1">Masuk dengan ID / NISN Anda</p>
    </div>

    <!-- Pilihan Tab Metode Login -->
    <div class="flex border-b mb-6">
      <button id="tab-manual-btn" onclick="switchTab('manual')" class="w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none">
        <i class="fas fa-keyboard mr-1"></i> Ketik ID
      </button>
      <button id="tab-scan-btn" onclick="switchTab('scan')" class="w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-indigo-600 focus:outline-none">
        <i class="fas fa-qrcode mr-1"></i> Scan Barcode
      </button>
    </div>

    <!-- FORM INPUT MANUAL -->
    <div id="tab-manual">
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">ID / NISN / NIP</label>
          <input type="text" id="user-id" placeholder="Masukkan ID / NISN / NIP" required
            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-600 focus:outline-none text-slate-800">
        </div>

        <button type="submit" id="btn-login"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md">
          Masuk
        </button>
      </form>
    </div>

    <!-- AREA SCANNER KAMERA -->
    <div id="tab-scan" class="hidden text-center space-y-4">
      <p class="text-xs text-slate-500">Arahkan QR Code / Barcode Kartu ke kamera</p>
      
      <div class="overflow-hidden rounded-2xl border-2 border-dashed border-indigo-300 p-2 bg-slate-50">
        <div id="reader" class="w-full"></div>
      </div>

      <button id="btn-toggle-cam" onclick="toggleCamera()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded-xl text-sm transition">
        <i class="fas fa-camera mr-1"></i> Buka Kamera
      </button>
    </div>

    <!-- STATUS LOGIN -->
    <div id="login-status" class="mt-4 text-center text-sm font-semibold hidden"></div>
  </div>

  <!-- MODAL VERIFIKASI PASSWORD KHUSUS ADMIN -->
  <div id="modal-admin-pass" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 border space-y-4">
      <div class="text-center">
        <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-xl mb-2 font-bold">
          <i class="fas fa-lock"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-800">Otentikasi Administrator</h3>
        <p class="text-xs text-slate-500 mt-1">Masukkan kata sandi khusus untuk mengakses Dashboard Admin.</p>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password Admin</label>
        <input type="password" id="admin-pass-input" placeholder="Masukkan Password" 
          class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-500 focus:outline-none text-slate-800 text-sm">
        <p id="admin-pass-error" class="text-xs text-red-600 mt-1 hidden font-semibold">Password salah! Silakan coba lagi.</p>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeAdminModal()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition">
          Batal
        </button>
        <button onclick="verifyAdminPassword()" class="w-1/2 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md">
          Verifikasi
        </button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFroZV42YVKy8UrVhh1nr8FR9jH9JBATUAhZ_O4QJfiG6d23ejVzHo0FWVY7zO8rEF/exec";
    const ADMIN_PASSWORD_DEFAULT = "admin123"; // Password khusus akses Admin
    
    let html5QrcodeScanner = null;
    let isCameraActive = false;
    let pendingAdminUser = null;

    // Navigasi Tab
    function switchTab(tab) {
      const tabManual = document.getElementById('tab-manual');
      const tabScan = document.getElementById('tab-scan');
      const btnManual = document.getElementById('tab-manual-btn');
      const btnScan = document.getElementById('tab-scan-btn');

      if (tab === 'manual') {
        tabManual.classList.remove('hidden');
        tabScan.classList.add('hidden');
        btnManual.className = "w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none";
        btnScan.className = "w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-indigo-600 focus:outline-none";
        stopScanner();
      } else {
        tabManual.classList.add('hidden');
        tabScan.classList.remove('hidden');
        btnScan.className = "w-1/2 py-2 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none";
        btnManual.className = "w-1/2 py-2 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-indigo-600 focus:outline-none";
      }
    }

    // Toggle Kamera
    function toggleCamera() {
      if (isCameraActive) {
        stopScanner();
      } else {
        startScanner();
      }
    }

    function startScanner() {
      html5QrcodeScanner = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
      ).then(() => {
        isCameraActive = true;
        document.getElementById('btn-toggle-cam').innerHTML = '<i class="fas fa-video-slash mr-1"></i> Matikan Kamera';
      }).catch(err => {
        alert("Gagal mengakses kamera. Pastikan izin kamera telah diaktifkan.");
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner && isCameraActive) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          isCameraActive = false;
          document.getElementById('btn-toggle-cam').innerHTML = '<i class="fas fa-camera mr-1"></i> Buka Kamera';
        }).catch(err => console.error(err));
      }
    }

    // Hasil Scan Barcode Berhasil
    function onScanSuccess(decodedText) {
      stopScanner();
      processLogin(decodedText.trim());
    }

    // Handle Form Input Manual
    function handleLogin(e) {
      e.preventDefault();
      const idInput = document.getElementById('user-id').value.trim();
      processLogin(idInput);
    }

    // Eksekusi Login ke Apps Script
    function processLogin(idUser) {
      const statusEl = document.getElementById('login-status');
      const btnLogin = document.getElementById('btn-login');

      statusEl.className = "mt-4 text-center text-sm font-semibold text-indigo-600";
      statusEl.innerText = "Memverifikasi data...";
      statusEl.classList.remove('hidden');
      if (btnLogin) btnLogin.disabled = true;

      const script = document.createElement('script');
      const callbackName = 'onUsersReceived_' + Math.round(Math.random() * 100000);
      
      window[callbackName] = function(users) {
        delete window[callbackName];
        if (script.parentNode) {
          document.body.removeChild(script);
        }

        const foundUser = users.find(u => String(u.id).trim() === idUser);

        if (foundUser) {
          const userRole = String(foundUser.role || '').toLowerCase();

          // PENGALIHAN KHUSUS ADMIN DENGAN POP-UP PASSWORD
          if (userRole === "admin") {
            pendingAdminUser = foundUser;
            statusEl.classList.add('hidden');
            if (btnLogin) btnLogin.disabled = false;
            
            // Tampilkan Modal Password Admin
            document.getElementById('admin-pass-input').value = "";
            document.getElementById('admin-pass-error').classList.add('hidden');
            document.getElementById('modal-admin-pass').classList.remove('hidden');
          } else {
            // Login Langsung untuk Siswa dan Guru
            localStorage.setItem('session_user', JSON.stringify(foundUser));
            statusEl.className = "mt-4 text-center text-sm font-semibold text-emerald-600";
            statusEl.innerText = "Berhasil masuk! Mengalihkan...";
            
            setTimeout(() => {
              if (userRole === "guru") {
                window.location.href = "dashboard-guru.html";
              } else {
                window.location.href = "dashboard.html";
              }
            }, 500);
          }
        } else {
          statusEl.className = "mt-4 text-center text-sm font-semibold text-red-600";
          statusEl.innerText = "ID / NISN (" + idUser + ") tidak ditemukan!";
          if (btnLogin) btnLogin.disabled = false;
        }
      };

      script.src = `${GOOGLE_SCRIPT_URL}?action=getUsers&callback=${callbackName}`;
      script.onerror = function() {
        statusEl.className = "mt-4 text-center text-sm font-semibold text-red-600";
        statusEl.innerText = "Gagal terhubung ke server!";
        if (btnLogin) btnLogin.disabled = false;
      };
      document.body.appendChild(script);
    }

    // Fungsi Verifikasi Password Modal Admin
    function verifyAdminPassword() {
      const inputPass = document.getElementById('admin-pass-input').value;
      const errorEl = document.getElementById('admin-pass-error');

      if (inputPass === ADMIN_PASSWORD_DEFAULT) {
        errorEl.classList.add('hidden');
        localStorage.setItem('session_user', JSON.stringify(pendingAdminUser));
        window.location.href = "dashboard-admin.html";
      } else {
        errorEl.classList.remove('hidden');
      }
    }

    function closeAdminModal() {
      pendingAdminUser = null;
      document.getElementById('modal-admin-pass').classList.add('hidden');
    }
  </script>
</body>
</html>
