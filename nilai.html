<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Informatika - Nilai & Rapor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4">

  <div class="w-full max-w-7xl mx-auto">
    <header class="bg-indigo-900 text-white px-6 py-4 flex justify-between items-center shadow-md rounded-2xl mb-6">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-700 p-2 rounded-lg font-bold">LMS</div>
        <h1 class="text-xl font-bold">Nilai & Rapor Siswa</h1>
      </div>
      <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg font-bold">Keluar</button>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <aside class="md:col-span-1 bg-white p-4 rounded-xl shadow-sm space-y-2 h-fit">
        <a href="dashboard.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-home"></i> Beranda</a>
        <a href="tugas.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-tasks"></i> Tugas Saya</a>
        <a href="kehadiran.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-calendar-check"></i> Kehadiran</a>
        <a href="nilai.html" class="p-3 bg-indigo-50 text-indigo-700 rounded-lg font-semibold flex items-center gap-3"><i class="fas fa-trophy"></i> Nilai & Rapor</a>
      </aside>

      <section class="md:col-span-3 space-y-4">
        <div class="bg-white p-6 rounded-xl shadow-sm border">
          <h3 class="text-lg font-bold mb-4">Transkrip Nilai Akademik</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 text-slate-600 uppercase text-xs">
                <tr>
                  <th class="p-3">Mata Pelajaran</th>
                  <th class="p-3">Tugas</th>
                  <th class="p-3">UTS</th>
                  <th class="p-3">UAS</th>
                  <th class="p-3">Rata-Rata</th>
                </tr>
              </thead>
              <tbody id="table-nilai">
                <tr><td colspan="5" class="p-4 text-center text-slate-400">Memuat data dari Google Sheets...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFroZV42YVKy8UrVhh1nr8FR9jH9JBATUAhZ_O4QJfiG6d23ejVzHo0FWVY7zO8rEF/exec";
    const userData = JSON.parse(localStorage.getItem('session_user'));

    if (!userData) {
      window.location.href = "index.html";
    } else {
      loadNilai();
    }

    function loadNilai() {
      const script = document.createElement('script');
      script.src = `${GOOGLE_SCRIPT_URL}?action=getNilai&id=${userData.id}&callback=renderNilai`;
      document.body.appendChild(script);
    }

    function renderNilai(data) {
      const tbody = document.getElementById('table-nilai');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-slate-400">Belum ada nilai yang diinput.</td></tr>';
        return;
      }

      data.forEach(row => {
        const t = parseFloat(row.tugas) || 0;
        const uts = parseFloat(row.uts) || 0;
        const uas = parseFloat(row.uas) || 0;
        const avg = ((t + uts + uas) / 3).toFixed(1);

        tbody.innerHTML += `
          <tr class="border-b hover:bg-slate-50">
            <td class="p-3 font-medium">${row.mapel}</td>
            <td class="p-3">${t}</td>
            <td class="p-3">${uts}</td>
            <td class="p-3">${uas}</td>
            <td class="p-3 font-bold text-indigo-700">${avg}</td>
          </tr>
        `;
      });
    }

    function logout() { localStorage.removeItem('session_user'); window.location.href = "index.html"; }
  </script>
</body>
</html>
