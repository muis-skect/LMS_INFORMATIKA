<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Informatika - Modul Materi Pembelajaran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4">

  <div class="w-full max-w-7xl mx-auto space-y-6">
    <!-- Navbar Topbar -->
    <header class="bg-indigo-900 text-white px-6 py-4 flex justify-between items-center shadow-md rounded-2xl">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 px-3 py-1 rounded-lg font-bold text-xs uppercase">LMS</div>
        <h1 class="text-xl font-bold">LMS Informatika Sekolah</h1>
      </div>
      <div class="flex items-center gap-4">
        <span id="role-badge" class="text-xs bg-amber-500 text-indigo-950 font-bold px-3 py-1 rounded-full">Mode</span>
        <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg font-bold flex items-center gap-1">
          <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
      </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <!-- Sidebar Navigasi -->
      <aside class="md:col-span-1 bg-white p-4 rounded-xl shadow-sm space-y-2 h-fit border" id="sidebar-nav"></aside>

      <!-- Main Content -->
      <section class="md:col-span-3 space-y-6">
        <!-- Header Halaman Materi -->
        <div class="bg-indigo-800 text-white p-6 rounded-xl shadow-md flex flex-wrap justify-between items-center gap-4">
          <div>
            <h2 id="judul-mapel" class="text-2xl font-bold flex items-center gap-2"><i class="fas fa-book-open"></i> Modul Pembelajaran</h2>
            <p id="sub-info-kelas" class="text-indigo-200 mt-1 text-sm">Bahan bacaan PDF, materi presentasi PPT, dan video pembelajaran.</p>
          </div>
          
          <div class="flex items-center gap-3">
            <!-- Filter Pilih Mapel (Struktur Asli) -->
            <select id="select-mapel-filter" onchange="gantiFilterMapel(this.value)" class="px-3 py-2 bg-indigo-900 border border-indigo-600 text-white text-xs font-bold rounded-lg focus:outline-none">
              <option value="Informatika Dasar">Informatika Dasar</option>
              <option value="Algoritma dan Pemrograman">Algoritma & Pemrograman</option>
            </select>

            <button id="btn-tambah" onclick="toggleModal(true)" class="hidden bg-amber-500 hover:bg-amber-600 text-indigo-950 font-bold px-4 py-2 rounded-lg text-sm shadow flex items-center gap-2">
              <i class="fas fa-plus"></i> Tambah Materi
            </button>
          </div>
        </div>

        <!-- Container List Materi -->
        <div id="container-materi" class="space-y-4">
          <div class="text-center py-8 text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat modul materi...</div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal Form Input Materi Baru (Struktur Asli) -->
  <div id="modal-form" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-800"><i class="fas fa-plus-circle text-indigo-600"></i> Tambah Bahan Materi Baru</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
      </div>
      
      <div class="space-y-3">
        <!-- Mata Pelajaran Dikunci menggunakan Dropdown (Struktur Asli) -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Mata Pelajaran</label>
          <select id="m-mapel" class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-100 font-semibold cursor-not-allowed" disabled>
            <option value="Informatika Dasar">Informatika Dasar</option>
            <option value="Algoritma dan Pemrograman">Algoritma & Pemrograman</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Judul Bab / Topik Utama</label>
            <input type="text" id="m-bab" placeholder="Contoh: Berpikir Komputasional" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Sub Bab / Pembahasan</label>
            <input type="text" id="m-sub" placeholder="Contoh: Pembahasan I - Algoritma" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Ringkasan Materi / Pengantar</label>
          <textarea id="m-teks" rows="3" placeholder="Tuliskan ulasan ringkas materi di sini..." class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
        </div>

        <hr class="border-slate-200">
        <p class="text-xs font-bold text-indigo-700"><i class="fas fa-link mr-1"></i> Link Bahan Pembelajaran (Opsional)</p>

        <!-- 3 KOLOM LINK PDF (Struktur Asli) -->
        <div class="space-y-2 bg-red-50/50 p-3 rounded-lg border border-red-100">
          <label class="block text-xs font-bold text-red-600"><i class="fas fa-file-pdf mr-1"></i> Link File PDF (Google Drive / Canva / Web)</label>
          <input type="url" id="m-pdf1" placeholder="Link PDF 1 (https://...)" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
          <input type="url" id="m-pdf2" placeholder="Link PDF 2 (https://...)" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
          <input type="url" id="m-pdf3" placeholder="Link PDF 3 (https://...)" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
        </div>

        <!-- 3 KOLOM LINK PPT (Struktur Asli) -->
        <div class="space-y-2 bg-amber-50/50 p-3 rounded-lg border border-amber-100">
          <label class="block text-xs font-bold text-amber-600"><i class="fas fa-file-powerpoint mr-1"></i> Link Presentasi PPT</label>
          <input type="url" id="m-ppt1" placeholder="Link PPT 1 (https://...)" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
          <input type="url" id="m-ppt2" placeholder="Link PPT 2 (https://...)" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
          <input type="url" id="m-ppt3" placeholder="Link PPT 3 (https://...)" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
        </div>

        <!-- 3 KOLOM LINK VIDEO (Struktur Asli) -->
        <div class="space-y-2 bg-blue-50/50 p-3 rounded-lg border border-blue-100">
          <label class="block text-xs font-bold text-blue-600"><i class="fab fa-youtube text-red-600 mr-1"></i> Link Video Youtube</label>
          <input type="url" id="m-video1" placeholder="Link Video 1 (https://youtube.com/watch?v=...)" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
          <input type="url" id="m-video2" placeholder="Link Video 2 (https://youtube.com/watch?v=...)" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
          <input type="url" id="m-video3" placeholder="Link Video 3 (https://youtube.com/watch?v=...)" class="w-full px-3 py-1.5 border rounded-lg text-xs bg-white">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t">
        <button onclick="toggleModal(false)" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-bold">Batal</button>
        <button id="btn-submit" onclick="simpanMateri()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold shadow">Simpan & Terbitkan</button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFroZV42YVKy8UrVhh1nr8FR9jH9JBATUAhZ_O4QJfiG6d23ejVzHo0FWVY7zO8rEF/exec";
    const user = JSON.parse(localStorage.getItem('session_user')) || { nama: 'Pengguna', role: 'Siswa' };
    
    // Menangkap parameter dari URL (Mapel & Kelas) secara aman tanpa merusak struktur
    const urlParams = new URLSearchParams(window.location.search);
    let selectedMapel = urlParams.get('mapel') || 'Informatika Dasar';
    let selectedKelas = urlParams.get('kelas') || 'Semua';

    document.getElementById('role-badge').innerText = (user.role || 'Siswa') + ' Mode';
    
    function setHeaderMapel(mapel) {
      selectedMapel = mapel;
      document.getElementById('judul-mapel').innerHTML = `<i class="fas fa-book-open"></i> ${selectedMapel} ${selectedKelas !== 'Semua' ? '('+selectedKelas+')' : ''}`;
      document.getElementById('m-mapel').value = selectedMapel;
      document.getElementById('select-mapel-filter').value = selectedMapel;
    }

    setHeaderMapel(selectedMapel);

    if (user.role === 'Guru' || user.role === 'Admin') {
      document.getElementById('btn-tambah').classList.remove('hidden');
    }

    // Dynamic Sidebar Navigasi
    const sidebar = document.getElementById('sidebar-nav');
    if (user.role === 'Siswa') {
      sidebar.innerHTML = `
        <a href="dashboard.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-home"></i> Beranda</a>
        <a href="pengumuman.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-bullhorn"></i> Pemberitahuan</a>
        <a href="materi.html?mapel=Informatika%20Dasar" class="p-3 bg-indigo-50 text-indigo-700 rounded-lg font-semibold flex items-center gap-3"><i class="fas fa-book-open"></i> Materi Pembelajaran</a>
        <a href="tugas.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-tasks"></i> Tugas Saya</a>
        <a href="kehadiran.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-calendar-check"></i> Kehadiran</a>
        <a href="nilai.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-trophy"></i> Nilai & Rapor</a>
      `;
    } else {
      sidebar.innerHTML = `
        <a href="dashboard-guru.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-chalkboard-teacher"></i> Beranda Guru</a>
        <a href="pengumuman.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-bullhorn"></i> Pemberitahuan</a>
        <a href="materi.html?mapel=Informatika%20Dasar" class="p-3 bg-indigo-50 text-indigo-700 rounded-lg font-semibold flex items-center gap-3"><i class="fas fa-book-open"></i> Kelola Materi</a>
        <a href="kelola-tugas.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-tasks"></i> Kelola Tugas</a>
        <a href="kelola-latihan.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-pen-nib"></i> Kelola Latihan</a>
        <a href="kelola-ujian.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-file-signature"></i> Kelola Ujian CP</a>
        <a href="rekap-kehadiran.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-calendar-check"></i> Rekap Kehadiran</a>
        <a href="input-nilai.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-trophy"></i> Input Nilai & Rapor</a>
      `;
    }

    function gantiFilterMapel(newMapel) {
      setHeaderMapel(newMapel);
      fetchMateri();
    }

    // Ambil Data Materi dari Spreadsheet dengan Filter Kelas & Mapel
    function fetchMateri() {
      const container = document.getElementById('container-materi');
      container.innerHTML = `<div class="text-center py-8 text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat modul materi...</div>`;

      const callbackName = 'onMateriReceived_' + Math.round(Math.random() * 100000);
      const script = document.createElement('script');

      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) document.body.removeChild(script);

        container.innerHTML = '';

        // Filter data sesuai mapel dan kelas target dari URL
        const filteredMateri = (data || []).filter(item => {
          const matchMapel = item.mapel && item.mapel.toLowerCase().includes(selectedMapel.toLowerCase());
          const matchKelas = selectedKelas === 'Semua' || !item.targetKelas || item.targetKelas === 'Semua' || item.targetKelas.toLowerCase() === selectedKelas.toLowerCase();
          return matchMapel && matchKelas;
        });

        if (filteredMateri.length === 0) {
          container.innerHTML = `<div class="bg-white p-8 rounded-xl border text-center text-slate-500">Belum ada modul materi untuk ${selectedMapel} ${selectedKelas !== 'Semua' ? '('+selectedKelas+')' : ''}.</div>`;
          return;
        }

        filteredMateri.forEach(item => {
          const tombolHapus = (user.role === 'Guru' || user.role === 'Admin') 
            ? `<button onclick="hapusMateri('${item.id}')" class="text-xs text-red-500 hover:text-red-700 font-bold border border-red-200 bg-red-50 px-2.5 py-1 rounded-lg transition">
                 <i class="fas fa-trash-alt"></i> Hapus
               </button>`
            : '';

          let pdfButtons = '';
          [item.urlPdf1, item.urlPdf2, item.urlPdf3].forEach((url, index) => {
            if (url) pdfButtons += `<a href="${url}" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-red-50 text-red-700 border border-red-200 rounded-lg text-xs font-bold hover:bg-red-100 transition"><i class="fas fa-file-pdf text-red-600"></i> PDF ${index + 1}</a>`;
          });

          let pptButtons = '';
          [item.urlPpt1, item.urlPpt2, item.urlPpt3].forEach((url, index) => {
            if (url) pptButtons += `<a href="${url}" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-amber-50 text-amber-700 border border-amber-200 rounded-lg text-xs font-bold hover:bg-amber-100 transition"><i class="fas fa-file-powerpoint text-amber-600"></i> PPT ${index + 1}</a>`;
          });

          let videoButtons = '';
          [item.urlVideo1, item.urlVideo2, item.urlVideo3].forEach((url, index) => {
            if (url) videoButtons += `<a href="${url}" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-blue-50 text-blue-700 border border-blue-200 rounded-lg text-xs font-bold hover:bg-blue-100 transition"><i class="fab fa-youtube text-red-600"></i> Video ${index + 1}</a>`;
          });

          container.innerHTML += `
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
              <div class="flex justify-between items-center border-b pb-2">
                <div>
                  <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-200">${item.judulBab}</span>
                  <h3 class="text-lg font-bold text-slate-800 mt-1">${item.subBab}</h3>
                </div>
                ${tombolHapus}
              </div>

              <p class="text-sm text-slate-600 leading-relaxed">${item.isiTeks || 'Tidak ada deskripsi teks.'}</p>

              <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-100">
                ${pdfButtons} ${pptButtons} ${videoButtons}
              </div>
            </div>
          `;
        });
      };

      script.src = `${GOOGLE_SCRIPT_URL}?action=getMateri&callback=${callbackName}`;
      document.body.appendChild(script);
    }

    // Simpan Materi Baru dengan menyertakan target kelas
    function simpanMateri() {
      const bab = document.getElementById('m-bab').value.trim();
      const sub = document.getElementById('m-sub').value.trim();
      const teks = document.getElementById('m-teks').value.trim();

      if (!bab || !sub) {
        alert('Mohon isi Judul Bab dan Sub Bab!');
        return;
      }

      const btnSubmit = document.getElementById('btn-submit');
      btnSubmit.disabled = true;
      btnSubmit.innerText = "Menyimpan...";

      const payload = {
        action: "addMateri",
        id: "MAT-" + Date.now(),
        mapel: selectedMapel,
        judulBab: bab,
        subBab: sub,
        isiTeks: teks,
        targetKelas: selectedKelas,
        urlPdf1: document.getElementById('m-pdf1').value.trim(),
        urlPdf2: document.getElementById('m-pdf2').value.trim(),
        urlPdf3: document.getElementById('m-pdf3').value.trim(),
        urlPpt1: document.getElementById('m-ppt1').value.trim(),
        urlPpt2: document.getElementById('m-ppt2').value.trim(),
        urlPpt3: document.getElementById('m-ppt3').value.trim(),
        urlVideo1: document.getElementById('m-video1').value.trim(),
        urlVideo2: document.getElementById('m-video2').value.trim(),
        urlVideo3: document.getElementById('m-video3').value.trim()
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(() => {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Simpan & Terbitkan";
        document.getElementById('m-bab').value = '';
        document.getElementById('m-sub').value = '';
        document.getElementById('m-teks').value = '';
        document.getElementById('m-pdf1').value = '';
        document.getElementById('m-pdf2').value = '';
        document.getElementById('m-pdf3').value = '';
        document.getElementById('m-ppt1').value = '';
        document.getElementById('m-ppt2').value = '';
        document.getElementById('m-ppt3').value = '';
        document.getElementById('m-video1').value = '';
        document.getElementById('m-video2').value = '';
        document.getElementById('m-video3').value = '';
        toggleModal(false);
        fetchMateri();
        alert('Materi baru berhasil ditambahkan!');
      })
      .catch(() => {
        alert("Terjadi kesalahan saat menyimpan materi.");
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Simpan & Terbitkan";
      });
    }

    function hapusMateri(id) {
      if (confirm('Apakah Anda yakin ingin menghapus modul ini?')) {
        const payload = { action: "deleteMateri", id: id };
        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        })
        .then(() => {
          fetchMateri();
          alert('Modul materi berhasil dihapus!');
        });
      }
    }

    function toggleModal(show) {
      document.getElementById('modal-form').classList.toggle('hidden', !show);
    }

    function logout() {
      localStorage.removeItem('session_user');
      window.location.href = "index.html";
    }

    fetchMateri();
  </script>
</body>
</html>
