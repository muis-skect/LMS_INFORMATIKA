<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Informatika - Materi Pelajaran</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4">

  <div class="w-full max-w-7xl mx-auto">
    <header class="bg-indigo-900 text-white px-6 py-4 flex justify-between items-center shadow-md rounded-2xl mb-6">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="bg-indigo-700 p-2 rounded-lg font-bold"><i class="fas fa-arrow-left"></i></a>
        <h1 class="text-xl font-bold" id="mapel-title">Materi Pelajaran</h1>
      </div>
      <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg font-bold">Keluar</button>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <aside class="md:col-span-1 bg-white p-4 rounded-xl shadow-sm space-y-2 h-fit">
        <a href="dashboard.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg">
          <i class="fas fa-home"></i> Beranda
        </a>
        <a href="tugas.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg">
          <i class="fas fa-tasks"></i> Tugas Saya
        </a>
      </aside>

      <section class="md:col-span-3 space-y-4">
        <h3 class="text-xl font-bold">Modul Pembelajaran</h3>
        
        <div class="bg-white p-5 rounded-xl shadow-sm border">
          <h4 class="font-bold text-lg text-indigo-700">Modul 1: Pengenalan Sistem Komputer</h4>
          <p class="text-sm text-slate-600 mt-2">Membahas tentang komponen utama hardware, software, dan brainware.</p>
          <div class="mt-4 flex gap-3">
            <button class="bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold"><i class="fas fa-file-pdf mr-1"></i> Baca Materi PDF</button>
            <button class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold"><i class="fas fa-video mr-1"></i> Tonton Video</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const userData = JSON.parse(localStorage.getItem('session_user'));
    if (!userData) window.location.href = "index.html";

    const urlParams = new URLSearchParams(window.location.search);
    const mapel = urlParams.get('mapel');
    if (mapel) document.getElementById('mapel-title').innerText = "Materi: " + mapel;

    function logout() { localStorage.removeItem('session_user'); window.location.href = "index.html"; }
  </script>
</body>
</html>
