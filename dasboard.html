<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Informatika - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4">

  <div class="w-full max-w-7xl mx-auto">
    <!-- Navbar -->
    <header class="bg-indigo-900 text-white px-6 py-4 flex justify-between items-center shadow-md rounded-2xl mb-6">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-700 p-2 rounded-lg font-bold">LMS</div>
        <h1 class="text-xl font-bold">LMS Informatika Sekolah</h1>
      </div>
      <div class="flex items-center gap-4">
        <span id="display-role" class="text-sm bg-indigo-800 px-3 py-1 rounded-full">User Mode</span>
        <div id="display-avatar" class="w-9 h-9 rounded-full bg-indigo-500 flex items-center justify-center font-bold">U</div>
        <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg font-bold">
          <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
      </div>
    </header>

    <!-- Main Section -->
    <main class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <aside class="md:col-span-1 bg-white p-4 rounded-xl shadow-sm space-y-2 h-fit">
        <div class="p-3 bg-indigo-50 text-indigo-700 rounded-lg font-semibold flex items-center gap-3">
          <i class="fas fa-home"></i> Beranda
        </div>
        <a href="#" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg">
          <i class="fas fa-book"></i> Kelas Saya
        </a>
      </aside>

      <section class="md:col-span-3 space-y-6">
        <div class="bg-indigo-700 text-white p-6 rounded-xl shadow-md flex justify-between items-center">
          <div>
            <h2 id="welcome-title" class="text-2xl font-bold">Selamat Datang!</h2>
            <p id="welcome-sub" class="text-indigo-200 mt-1">Memuat data...</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Pengecekan Sesi Login
    const userData = JSON.parse(localStorage.getItem('session_user'));

    if (!userData) {
      alert("Anda belum login!");
      window.location.href = "index.html";
    } else {
      document.getElementById('display-role').innerText = userData.role + " Mode";
      document.getElementById('display-avatar').innerText = userData.nama[0];
      document.getElementById('welcome-title').innerText = "Selamat Datang, " + userData.nama + "!";
      document.getElementById('welcome-sub').innerText = `ID: ${userData.id} | ${userData.detail}`;
    }

    function logout() {
      localStorage.removeItem('session_user');
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
