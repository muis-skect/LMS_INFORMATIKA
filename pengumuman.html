<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Informatika - Papan Pemberitahuan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4">

  <div class="w-full max-w-7xl mx-auto">
    <!-- Topbar -->
    <header class="bg-indigo-900 text-white px-6 py-4 flex justify-between items-center shadow-md rounded-2xl mb-6">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 px-3 py-1 rounded-lg font-bold">LMS</div>
        <h1 class="text-xl font-bold">LMS Informatika Sekolah</h1>
      </div>
      <div class="flex items-center gap-4">
        <span id="role-badge" class="text-xs bg-amber-500 text-indigo-950 font-bold px-3 py-1 rounded-full">Mode</span>
        <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg font-bold flex items-center gap-1">
          <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
      </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <aside class="md:col-span-1 bg-white p-4 rounded-xl shadow-sm space-y-2 h-fit border" id="sidebar-nav"></aside>

      <section class="md:col-span-3 space-y-6">
        <div class="bg-rose-700 text-white p-6 rounded-xl shadow-md flex justify-between items-center">
          <div>
            <h2 class="text-2xl font-bold flex items-center gap-2"><i class="fas fa-bullhorn"></i> Papan Pemberitahuan</h2>
            <p class="text-rose-100 mt-1 text-sm">Informasi terhubung langsung dengan Google Sheets.</p>
          </div>
          <button id="btn-tambah" onclick="toggleModal(true)" class="hidden bg-amber-500 hover:bg-amber-600 text-indigo-950 font-bold px-4 py-2 rounded-lg text-sm shadow flex items-center gap-2">
            <i class="fas fa-plus"></i> Tambah Pemberitahuan
          </button>
        </div>

        <div id="container-pemberitahuan" class="space-y-4">
          <div class="text-center py-8 text-slate-500"><i class="fas fa-spinner fa-spin mr-2"></i> Memuat data dari database...</div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal Form -->
  <div id="modal-form" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-800">Buat Pemberitahuan Baru</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
      </div>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Judul Pemberitahuan</label>
          <input type="text" id="p-judul" placeholder="Masukkan judul..." class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Kategori Label</label>
            <select id="p-kategori" class="w-full px-3 py-2 border rounded-lg text-sm">
              <option value="Penting">Penting</option>
              <option value="Informasi">Informasi</option>
              <option value="Mendesak">Mendesak</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Penulis</label>
            <input type="text" id="p-penulis" readonly class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-100 text-slate-600">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Isi Pemberitahuan</label>
          <textarea id="p-isi" rows="4" placeholder="Tuliskan isi pesan..." class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t">
        <button onclick="toggleModal(false)" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-bold">Batal</button>
        <button id="btn-submit" onclick="simpanPemberitahuan()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold shadow">Terbitkan</button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFroZV42YVKy8UrVhh1nr8FR9jH9JBATUAhZ_O4QJfiG6d23ejVzHo0FWVY7zO8rEF/exec";
    const user = JSON.parse(localStorage.getItem('session_user')) || { nama: 'Pengguna', role: 'Siswa' };
    
    document.getElementById('role-badge').innerText = (user.role || 'Siswa') + ' Mode';
    document.getElementById('p-penulis').value = user.nama || 'Guru Informatika';

    if (user.role === 'Guru' || user.role === 'Admin') {
      document.getElementById('btn-tambah').classList.remove('hidden');
    }

    // Render Sidebar
    const sidebar = document.getElementById('sidebar-nav');
    if (user.role === 'Siswa') {
      sidebar.innerHTML = `
        <a href="dashboard-siswa.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-home"></i> Beranda</a>
        <a href="pengumuman.html" class="p-3 bg-indigo-50 text-indigo-700 rounded-lg font-semibold flex items-center gap-3"><i class="fas fa-bullhorn"></i> Pemberitahuan</a>
        <a href="tugas-siswa.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-tasks"></i> Tugas Saya</a>
        <a href="kehadiran-siswa.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-calendar-check"></i> Kehadiran</a>
        <a href="nilai-siswa.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-trophy"></i> Nilai & Rapor</a>
      `;
    } else {
      sidebar.innerHTML = `
        <a href="dashboard-guru.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-chalkboard-teacher"></i> Beranda Guru</a>
        <a href="pengumuman.html" class="p-3 bg-indigo-50 text-indigo-700 rounded-lg font-semibold flex items-center gap-3"><i class="fas fa-bullhorn"></i> Pemberitahuan</a>
        <a href="kelola-tugas.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-tasks"></i> Kelola Tugas</a>
        <a href="kelola-latihan.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-pen-nib"></i> Kelola Latihan</a>
        <a href="kelola-ujian.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-file-signature"></i> Kelola Ujian CP</a>
        <a href="rekap-kehadiran.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-calendar-check"></i> Rekap Kehadiran</a>
        <a href="input-nilai.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-trophy"></i> Input Nilai & Rapor</a>
      `;
    }

    // Ambil Data dari Google Sheets
    function fetchPemberitahuan() {
      const callbackName = 'onDataReceived_' + Math.round(Math.random() * 100000);
      const script = document.createElement('script');

      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) document.body.removeChild(script);

        const container = document.getElementById('container-pemberitahuan');
        container.innerHTML = '';

        if (!data || data.length === 0) {
          container.innerHTML = `<div class="bg-white p-8 rounded-xl border text-center text-slate-500">Belum ada pemberitahuan.</div>`;
          return;
        }

        // Urutkan dari yang terbaru
        data.reverse().forEach(item => {
          const bgKategori = item.kategori === 'Penting' || item.kategori === 'Mendesak' ? 'bg-rose-100 text-rose-800' : 'bg-blue-100 text-blue-800';
          const tombolHapus = (user.role === 'Guru' || user.role === 'Admin') 
            ? `<button onclick="hapusPemberitahuan('${item.id}')" class="text-xs text-red-500 hover:text-red-700 font-bold border border-red-200 bg-red-50 px-2 py-1 rounded-lg">
                 <i class="fas fa-trash-alt"></i> Hapus
               </button>`
            : '';

          container.innerHTML += `
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
              <div class="flex justify-between items-center text-xs text-slate-500 border-b pb-2">
                <span class="font-bold px-2.5 py-0.5 rounded-full ${bgKategori}">${item.kategori}</span>
                <div class="flex items-center gap-3">
                  <span><i class="far fa-clock"></i> ${item.waktu}</span>
                  ${tombolHapus}
                </div>
              </div>
              <h3 class="text-lg font-bold text-slate-800">${item.judul}</h3>
              <p class="text-sm text-slate-600 leading-relaxed">${item.isi}</p>
              <p class="text-xs text-slate-400 pt-2 border-t">Oleh: ${item.penulis}</p>
            </div>
          `;
        });
      };

      script.src = `${GOOGLE_SCRIPT_URL}?action=getPemberitahuan&callback=${callbackName}`;
      document.body.appendChild(script);
    }

    // Simpan ke Google Sheets
    function simpanPemberitahuan() {
      const judul = document.getElementById('p-judul').value.trim();
      const kategori = document.getElementById('p-kategori').value;
      const isi = document.getElementById('p-isi').value.trim();
      const btnSubmit = document.getElementById('btn-submit');

      if (!judul || !isi) {
        alert('Mohon isi Judul dan Isi Pemberitahuan!');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerText = "Menerbitkan...";

      const payload = {
        action: "addPemberitahuan",
        id: "INF-" + Date.now(),
        judul: judul,
        kategori: kategori,
        penulis: user.nama || "Guru Informatika",
        waktu: "Baru Saja",
        isi: isi
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(() => {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Terbitkan";
        document.getElementById('p-judul').value = '';
        document.getElementById('p-isi').value = '';
        toggleModal(false);
        fetchPemberitahuan();
        alert('Pemberitahuan berhasil disimpan di Google Sheets!');
      })
      .catch(err => {
        alert("Gagal menghubungkan ke database Google Sheets.");
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Terbitkan";
      });
    }

    // Hapus dari Google Sheets
    function hapusPemberitahuan(id) {
      if (confirm('Apakah Anda yakin ingin menghapus pemberitahuan ini dari database?')) {
        const payload = { action: "deletePemberitahuan", id: id };
        
        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        })
        .then(() => {
          fetchPemberitahuan();
          alert('Pemberitahuan berhasil dihapus!');
        });
      }
    }

    function toggleModal(show) {
      document.getElementById('modal-form').classList.toggle('hidden', !show);
    }

    function logout() {
      localStorage.removeItem('session_user');
      window.location.href = "index.html";
    }

    fetchPemberitahuan();
  </script>
</body>
</html>
