<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Informatika - Papan Pengumuman</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4">

  <div class="w-full max-w-7xl mx-auto">
    <!-- Navbar -->
    <header class="bg-indigo-900 text-white px-6 py-4 flex justify-between items-center shadow-md rounded-2xl mb-6">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 px-3 py-1 rounded-lg font-bold">LMS</div>
        <h1 class="text-xl font-bold">LMS Informatika Sekolah</h1>
      </div>
      <div class="flex items-center gap-4">
        <span id="role-badge" class="text-xs bg-amber-500 text-indigo-950 font-bold px-3 py-1 rounded-full">Mode</span>
        <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg font-bold flex items-center gap-1">
          <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
      </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <!-- Sidebar Navigasi -->
      <aside class="md:col-span-1 bg-white p-4 rounded-xl shadow-sm space-y-2 h-fit border" id="sidebar-nav"></aside>

      <!-- Main Content -->
      <section class="md:col-span-3 space-y-6">
        <div class="bg-rose-700 text-white p-6 rounded-xl shadow-md flex justify-between items-center">
          <div>
            <h2 class="text-2xl font-bold flex items-center gap-2"><i class="fas fa-bullhorn"></i> Papan Pengumuman</h2>
            <p class="text-rose-100 mt-1 text-sm">Informasi penting seputar pembelajaran dan kegiatan sekolah.</p>
          </div>
          <button id="btn-tambah" onclick="toggleForm()" class="hidden bg-amber-500 hover:bg-amber-600 text-indigo-950 font-bold px-4 py-2 rounded-lg text-sm shadow">
            + Buat Pengumuman
          </button>
        </div>

        <!-- Form Tambah Pengumuman (Tampil Khusus Guru & Admin) -->
        <div id="form-pengumuman" class="hidden bg-white p-5 rounded-xl border shadow-sm space-y-4">
          <h3 class="font-bold text-slate-800 border-b pb-2">Buat Pengumuman Baru</h3>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Judul Pengumuman</label>
              <input type="text" id="p-judul" placeholder="Contoh: Jadwal Ujian CP 1" class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Kategori</label>
                <select id="p-kategori" class="w-full px-3 py-2 border rounded-lg text-sm">
                  <option value="Penting">Penting</option>
                  <option value="Informasi">Informasi</option>
                  <option value="Mendesak">Mendesak</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Penulis</label>
                <input type="text" id="p-penulis" readonly class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-100">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Isi Pengumuman</label>
              <textarea id="p-isi" rows="3" placeholder="Tuliskan detail pengumuman..." class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
            </div>
            <div class="flex justify-end gap-2">
              <button onclick="toggleForm()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-bold">Batal</button>
              <button onclick="simpanPengumuman()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold">Terbitkan</button>
            </div>
          </div>
        </div>

        <!-- Daftar Pengumuman -->
        <div id="container-pengumuman" class="space-y-4"></div>
      </section>
    </main>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('session_user')) || { name: 'Guest', role: 'Siswa' };
    document.getElementById('role-badge').innerText = user.role + ' Mode';
    document.getElementById('p-penulis').value = user.name;

    // Menampilkan Tombol Tambah hanya untuk Guru / Admin
    if (user.role === 'Guru' || user.role === 'Admin') {
      document.getElementById('btn-tambah').classList.remove('hidden');
    }

    // Render Sidebar Sesuai Role
    const sidebar = document.getElementById('sidebar-nav');
    if (user.role === 'Siswa') {
      sidebar.innerHTML = `
        <a href="dashboard-siswa.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-home"></i> Beranda</a>
        <a href="tugas-siswa.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-tasks"></i> Tugas Saya</a>
        <a href="kehadiran-siswa.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-calendar-check"></i> Kehadiran</a>
        <a href="nilai-siswa.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-trophy"></i> Nilai & Rapor</a>
      `;
    } else {
      sidebar.innerHTML = `
        <a href="dashboard-guru.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-chalkboard-teacher"></i> Beranda Guru</a>
        <a href="kelola-tugas.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-tasks"></i> Kelola Tugas</a>
        <a href="kelola-latihan.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-pen-nib"></i> Kelola Latihan</a>
        <a href="kelola-ujian.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-file-signature"></i> Kelola Ujian CP</a>
        <a href="rekap-kehadiran.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-calendar-check"></i> Rekap Kehadiran</a>
        <a href="input-nilai.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-trophy"></i> Input Nilai & Rapor</a>
      `;
    }

    const defaultPengumuman = [
      {
        judul: "Jadwal Ujian Capaian Pembelajaran (CP) Semester 1",
        kategori: "Penting",
        penulis: "Admin Sekolah",
        waktu: "Hari ini, 08.00 WIB",
        isi: "Diberitahukan kepada seluruh siswa kelas VII dan VIII bahwa pelaksanaan Ujian CP 1 akan dilaksanakan secara daring melalui LMS ini pada hari Jumat mendatang. Harap persiapkan diri dengan baik."
      },
      {
        judul: "Pembaruan Modul Pembelajaran Informatika",
        kategori: "Informasi",
        penulis: "Budi Santoso, S.Pd.",
        waktu: "Kemarin, 14.30 WIB",
        isi: "Materi baru untuk mata pelajaran Algoritma & Pemrograman telah diunggah. Silakan cek menu Beranda atau Masuk Kelas untuk mengunduh modul pembelajaran terbaru."
      }
    ];

    function renderPengumuman() {
      const data = JSON.parse(localStorage.getItem('lms_pengumuman')) || defaultPengumuman;
      const container = document.getElementById('container-pengumuman');
      container.innerHTML = '';

      data.forEach(item => {
        const bgKategori = item.kategori === 'Penting' ? 'bg-rose-100 text-rose-800' : 'bg-blue-100 text-blue-800';
        container.innerHTML += `
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-2">
            <div class="flex justify-between items-center text-xs text-slate-500">
              <span class="font-bold px-2.5 py-0.5 rounded-full ${bgKategori}">${item.kategori}</span>
              <span><i class="far fa-clock"></i> ${item.waktu}</span>
            </div>
            <h3 class="text-lg font-bold text-slate-800">${item.judul}</h3>
            <p class="text-sm text-slate-600 leading-relaxed">${item.isi}</p>
            <p class="text-xs text-slate-400 pt-2 border-t">Oleh: ${item.penulis}</p>
          </div>
        `;
      });
    }

    function toggleForm() {
      document.getElementById('form-pengumuman').classList.toggle('hidden');
    }

    function simpanPengumuman() {
      const judul = document.getElementById('p-judul').value;
      const kategori = document.getElementById('p-kategori').value;
      const isi = document.getElementById('p-isi').value;
      const penulis = user.name;

      if (!judul || !isi) {
        alert('Mohon isi judul dan isi pengumuman!');
        return;
      }

      const list = JSON.parse(localStorage.getItem('lms_pengumuman')) || defaultPengumuman;
      list.unshift({
        judul: judul,
        kategori: kategori,
        penulis: penulis,
        waktu: "Baru Saja",
        isi: isi
      });

      localStorage.setItem('lms_pengumuman', JSON.stringify(list));
      toggleForm();
      document.getElementById('p-judul').value = '';
      document.getElementById('p-isi').value = '';
      renderPengumuman();
      alert('Pengumuman berhasil diterbitkan!');
    }

    function logout() {
      localStorage.removeItem('session_user');
      window.location.href = "index.html";
    }

    renderPengumuman();
  </script>
</body>
</html>
