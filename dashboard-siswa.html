<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Siswa - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4">

  <div class="w-full max-w-7xl mx-auto">
    <header class="bg-indigo-900 text-white px-6 py-4 flex justify-between items-center shadow-md rounded-2xl mb-6">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 px-3 py-1 rounded-lg font-bold">LMS</div>
        <h1 class="text-xl font-bold">LMS Informatika Sekolah</h1>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-xs bg-amber-500 text-indigo-950 font-bold px-3 py-1 rounded-full">Siswa Mode</span>
        <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg font-bold flex items-center gap-1">
          <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
      </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <aside class="md:col-span-1 bg-white p-4 rounded-xl shadow-sm space-y-2 h-fit border">
        <a href="dashboard-siswa.html" class="p-3 bg-indigo-50 text-indigo-700 rounded-lg font-semibold flex items-center gap-3"><i class="fas fa-home"></i> Beranda</a>
        <a href="pengumuman.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-bullhorn"></i> Pemberitahuan</a>
        <a href="tugas-siswa.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-tasks"></i> Tugas Saya</a>
        <a href="kehadiran-siswa.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-calendar-check"></i> Kehadiran</a>
        <a href="nilai-siswa.html" class="flex items-center gap-3 p-3 text-slate-600 hover:bg-slate-50 rounded-lg"><i class="fas fa-trophy"></i> Nilai & Rapor</a>
      </aside>

      <section class="md:col-span-3 space-y-6">
        <div class="bg-indigo-800 text-white p-6 rounded-xl shadow-md">
          <h2 class="text-2xl font-bold">Selamat Datang di LMS Informatika!</h2>
          <p class="text-indigo-200 mt-1 text-sm">Silakan pilih menu di sebelah kiri atau lihat pemberitahuan terbaru dari Guru.</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    function logout() {
      localStorage.removeItem('session_user');
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
